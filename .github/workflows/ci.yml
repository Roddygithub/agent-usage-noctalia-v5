name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Luau
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - name: Install luau-lsp
        run: |
          # Use a specific known-working version to avoid breaking changes
          LUAU_LSP_VERSION="1.3.0"
          curl -L -o luau-lsp.zip "https://github.com/luau-lang/luau-lsp/releases/download/${LUAU_LSP_VERSION}/luau-lsp.zip"
          unzip luau-lsp.zip -d luau-lsp
          echo "$PWD/luau-lsp" >> $GITHUB_PATH

      - name: Luau Lint
        run: luau-lsp --check .

      - name: Protocol Round-trip Test
        run: lua specs/test_protocol_roundtrip.lua

      - name: Collector Unit Tests
        run: lua collectors/test_collectors.lua

      - name: Luau Format Check
        run: |
          cargo install stylua --locked
          stylua --check .

  release:
    needs: lint-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Release Artifacts
        run: |
          # Plugin is pure Luau, no build needed
          # Just create release archives
          mkdir -p dist
          git archive --format=tar.gz --prefix=agent-usage-noctalia-v5/ -o dist/agent-usage-noctalia-v5-${GITHUB_REF_NAME}.tar.gz ${GITHUB_REF_NAME}
          # Create plugin package for Noctalia
          cd dist
          tar -czf agent-usage-noctalia-v5-plugin-${GITHUB_REF_NAME#v}.tar.gz -C ../ agent-usage-noctalia-v5/plugin.toml agent-usage-noctalia-v5/*.luau agent-usage-noctalia-v5/collectors/ agent-usage-noctalia-v5/translations/ agent-usage-noctalia-v5/specs/ agent-usage-noctalia-v5/README.md agent-usage-noctalia-v5/LICENSE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}