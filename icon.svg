<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Head -->
  <rect x="5" y="2" width="14" height="10" rx="3" stroke="currentColor" fill="none"/>
  <!-- Eyes -->
  <circle cx="8.5" cy="6.5" r="1.5" fill="currentColor"/>
  <circle cx="15.5" cy="6.5" r="1.5" fill="currentColor"/>
  <!-- Antenna -->
  <line x1="12" y1="2" x2="12" y2="0" stroke="currentColor"/>
  <circle cx="12" cy="0" r="1" fill="currentColor"/>
  <!-- Body -->
  <rect x="4" y="14" width="16" height="8" rx="2" stroke="currentColor" fill="none"/>
  <!-- Arms -->
  <line x1="4" y1="16" x2="2" y2="20" stroke="currentColor"/>
  <line x1="20" y1="16" x2="22" y2="20" stroke="currentColor"/>
  <!-- Legs -->
  <line x1="8" y1="22" x2="8" y2="26" stroke="currentColor"/>
  <line x1="16" y1="22" x2="16" y2="26" stroke="currentColor"/>
  <!-- Display/Heart -->
  <rect x="8" y="15" width="8" height="4" rx="1" stroke="currentColor" fill="none"/>
  <line x1="10" y1="15" x2="10" y2="19" stroke="currentColor" stroke-dasharray="2 2"/>
  <line x1="14" y1="15" x2="14" y2="19" stroke="currentColor" stroke-dasharray="2 2"/>
</svg>